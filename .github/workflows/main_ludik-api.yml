name: Build and deploy ASP.Net Core app to Azure Web App - Ludik-Api
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
# --- Variables de entorno para facilitar el mantenimiento ---
env:
  AZURE_WEBAPP_NAME: 'Ludik-Api' # El nombre de tu App Service en Azure
  SOLUTION_PATH: 'Ludik/ludikApi/LudikAPI.sln' # La ruta a tu archivo de solución que proporcionaste
  DOTNET_VERSION: '8.0' # Especifica la versión de .NET
 
jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: windows-latest 
 
    steps:
      - name: '1. Checkout Repository'
        uses: actions/checkout@v4
 # =================================================================# --- PASO DE DEPURACIÓN AÑADIDO ---# Este paso nos mostrará la estructura de archivos exacta que ve el workflow.- name: 'DEBUG: List files in the repository'run: ls -R# =================================================================
      - name: '2. Setup .NET Environment'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
 
      - name: '3. Restore Dependencies'
        run: dotnet restore "${{ env.SOLUTION_PATH }}"
 
      - name: '4. Build Project'
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore
 
      - name: '5. Run Tests'
        run: dotnet test "${{ env.SOLUTION_PATH }}" --no-build --verbosity normal
        # Variables de entorno DUMMY para que las pruebas se ejecuten correctamente
        # sin necesidad de secretos de producción.
        env:
          ConnectionStrings__DefaultConnection: "Server=dummy;Database=dummy;User=dummy;Password=dummy;"
          Storage__ConnectionString: "DefaultEndpointsProtocol=https;AccountName=dummy;AccountKey=dummykey==;EndpointSuffix=core.windows.net"
          Jwt__SecretKey: "a_dummy_but_long_and_secret_key_for_ci_tests_1234567890"
          # Añade aquí cualquier otra clave que tu app necesite en el arranque
 
      - name: '6. Publish Application'
        run: dotnet publish "${{ env.SOLUTION_PATH }}" --configuration Release --no-build --output "${{ github.workspace }}/myapp"
 
      - name: '7. Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          # Usa el publish-profile que ya tienes configurado en los secretos de GitHub.
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F633EB439A28468DAB40E73F22F69562 }}
          # El paquete a desplegar es la carpeta de salida del paso de publicación.
          package: '${{ github.workspace }}/myapp'





